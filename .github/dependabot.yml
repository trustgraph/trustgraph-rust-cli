version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref is the Rust toolchain (`@stable`, `@1.85` for the MSRV job),
      # not an action version, so "upgrading" it would change what we test.
      - dependency-name: dtolnay/rust-toolchain
    # Generated by `dist generate`; its action versions are set in
    # dist-workspace.toml ([dist.github-action-commits]), and dist's CI check
    # fails if the file is edited by hand.
    exclude-paths:
      - .github/workflows/release.yml
  - package-ecosystem: npm  # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
