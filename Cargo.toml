[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/trustgraph/trustgraph-rust-cli"
homepage = "https://trustgraph.net"
authors = ["Trust Graph contributors"]

[workspace.dependencies]
trustgraph-core = { path = "crates/trustgraph-core", version = "0.1.0" }

anyhow = "1.0"
bs58 = "0.5"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
directories = "6.0"
ed25519-dalek = "3.0"
getrandom = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
rust_decimal = "1.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
napi-build = "2"
thiserror = "2.0"

assert_cmd = "2.2"
hex = "0.4"
predicates = "3.1"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Small, fast-loading WebAssembly: `cargo build --profile wasm --target wasm32-unknown-unknown -p trustgraph-wasm`
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
