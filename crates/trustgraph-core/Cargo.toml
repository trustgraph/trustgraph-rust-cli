[package]
name = "trustgraph-core"
description = "Trust Graph protocol core: Trust Atoms, signed trust claims and agent-centric trust graphs, with no I/O"
readme = "README.md"
keywords = ["trust", "reputation", "did", "verifiable-credentials", "web-of-trust"]
categories = ["cryptography", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
bs58.workspace = true
ed25519-dalek.workspace = true
getrandom = { workspace = true, optional = true }
jiff.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
# Opt-in OS / browser randomness: `Keypair::generate` and `api::generate_keypair`.
# Off by default so the core stays free of I/O; the CLI, WebAssembly and Node
# wrappers turn it on.
random = ["dep:getrandom"]

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
