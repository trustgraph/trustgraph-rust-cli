# cargo-deny: licenses, security advisories, duplicate crates and sources.
#   cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities and unsound crates fail the
# check; yanked versions do too.
yanked = "deny"
ignore = []

[licenses]
# Everything we ship is Apache-2.0, so every dependency must be compatible
# with distributing it under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",  # option-ext (via directories); file-level copyleft, unmodified
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The list above is a policy, not an inventory.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates that are not published (wasm, node) still have a license.
ignore = false

[bans]
# Two versions of one crate is worth knowing about, not worth failing CI.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
