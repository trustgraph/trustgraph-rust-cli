[workspace]
members = ["cargo:."]

# Config for 'dist' (prebuilt `trust` binaries, installers, Homebrew).
# See doc/releasing.md and https://axodotdev.github.io/cargo-dist/book/.
# After editing, run `dist generate` to update .github/workflows/release.yml.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "trustgraph/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Build only trustgraph-cli, not the whole workspace (the napi and wasm
# cdylibs do not build for every target).
precise-builds = true
# `brew install trustgraph/tap/trustgraph` (the binary is still `trust`)
formula = "trustgraph"
# Where the shell and PowerShell installers put `trust`: $XDG_BIN_HOME, or
# ~/.local/bin (the same place as install.sh's source-build fallback).
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Whether to install a standalone updater program
install-updater = false
# Verifiable build provenance for every archive (`gh attestation verify`).
github-attestations = true
# Which actions to run on pull requests: check the release plan only.
pr-run-mode = "plan"
# Keep the generated workflow on the same action majors as the rest of CI.
# Dependabot skips release.yml (see .github/dependabot.yml): bump these here
# and run `dist generate` instead.
[dist.github-action-commits]
"actions/checkout" = "v7"
"actions/upload-artifact" = "v7"
"actions/download-artifact" = "v8"
"actions/attest" = "v4"

# aarch64 Linux builds natively on GitHub's Arm runners.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-unknown-linux-musl = "ubuntu-22.04-arm"
